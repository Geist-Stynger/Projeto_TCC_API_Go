services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      network: host
    image: vaultlocal-backend:latest
    container_name: vaultlocal-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      GIN_MODE: ${GIN_MODE:-release}
      JWT_SECRET: ${JWT_SECRET:-tcc-go-jwt-secret}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${BACKEND_DATA_DIR:-./back-end/files}:/app/files
    networks:
      - vaultlocal-net

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: vaultlocal-frontend:latest
    container_name: vaultlocal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - vaultlocal-net

networks:
  vaultlocal-net:
    driver: bridge
